name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install C++ toolchain and Boost headers
        run: |
          # El runner trae un repo de Microsoft roto (403 en apt-get update)
          # que no necesitamos: solo usamos g++, make y Boost del archivo Ubuntu.
          sudo grep -rl 'packages.microsoft.com' /etc/apt/sources.list.d/ 2>/dev/null | xargs -r sudo rm -f
          sudo sed -i '/packages.microsoft.com/d' /etc/apt/sources.list 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y g++ libboost-dev make
      - name: Install Python package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run test suite
        run: |
          make -C cpp
          PYTHONPATH=src python -m pytest -q
          make -C cpp test
