name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install C++ toolchain and Boost headers
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libboost-dev make
      - name: Install Python package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run test suite
        run: make test
